      <script>
// Shared helpers inlined into every scene (deterministic, no clocks, no Math.random).

//  HF.dotText(canvas, text, o)  text sampled into dots (outline or fill); paint(mode, p)

  function lcg(seed) {
    var s = seed >>> 0;

  }

  function lum(hex) {

      case '-': return '<line x1="' + (x - 7) + '" y1="' + y + '" x2="' + (x + 7) + '" y2="' + y + '" ' + s + '/>';
      case '+': return '<g ' + s + '><line x1="' + (x - 7) + '" y1="' + y + '" x2="' + (x + 7) + '" y2="' + y + '"/><line x1="' + x + '" y1="' + (y - 7) + '" x2="' + x + '" y2="' + (y + 7) + '"/></g>';

      default: return '';

  }
  // o: { color, eyes, hat, hatColor, blush, ink, extra, cls, id }

  // Text -> dots. Samples the glyph OUTLINE (or the fill) of the text rastered at
  // `font`, centred at (x, y), on a grid. The table is built once; paint() is a pure
  // function of (mode, p): 'in' flies dots from a scattered cloud onto the glyphs,
  // 'hold' draws them in place, 'out' blows them away. The front sweeps left->right.
  function dotText(canvas, text, o) {

    var off = document.createElement('canvas'); off.width = w; off.height = h;
    var oc = off.getContext('2d', { willReadFrequently: true });

    oc.fillText(text, o.x, o.y);
    var d = oc.getImageData(0, 0, w, h).data, step = o.step || 4, band = o.band || 3, pts = [], rnd = lcg(o.seed || 7);
    var lit = function (x, y) { return x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 127; };
    var minX = 1e9, maxX = -1e9;
    for (var y = 0; y < h; y += step) for (var x = 0; x < w; x += step) {
      if (!lit(x, y)) continue;
      if (o.outline && lit(x - band, y) && lit(x + band, y) && lit(x, y - band) && lit(x, y + band)) continue;
      var a = rnd() * Math.PI * 2;
      pts.push({ x: x, y: y, ox: Math.cos(a), oy: Math.sin(a), dist: (0.06 + 0.16 * rnd()) * w, r: (o.r || 1.6) * (0.75 + 0.5 * rnd()), j: rnd() });
      if (x < minX) minX = x; if (x > maxX) maxX = x;
    }
    var span = Math.max(1, maxX - minX);
    for (var i = 0; i < pts.length; i++) pts[i].k = (pts[i].x - minX) / span;
    var color = o.color || '#ff7a2e';
    return {
      count: pts.length,
      paint: function (mode, p, alpha) {
        ctx.fillStyle = color;
        for (var i = 0; i < pts.length; i++) {
          var q = pts[i], u, dx = 0, dy = 0, a = alpha === undefined ? 1 : alpha;
          if (mode === 'in') {
            u = Math.min(1, Math.max(0, (p - q.k * 0.45 - q.j * 0.1) / 0.45));
            if (u <= 0) continue;
            var e = 1 - Math.pow(1 - u, 3);
            dx = q.ox * q.dist * (1 - e); dy = q.oy * q.dist * (1 - e); a *= Math.min(1, u * 3);
          } else if (mode === 'out') {
            u = Math.min(1, Math.max(0, (p - q.k * 0.45 - q.j * 0.1) / 0.45));
            dx = q.ox * q.dist * u * u * 1.4 + u * u * 120; dy = q.oy * q.dist * u * u; a *= 1 - u;
            if (a <= 0.01) continue;
          }
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.arc(q.x + dx, q.y + dy, q.r, 0, 6.2832); ctx.fill();
        }
        ctx.globalAlpha = 1;
      },
    };
  }
  return { lcg: lcg, bean: bean, eyes: eyes, dotText: dotText, INK: INK };
})();
