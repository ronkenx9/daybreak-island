<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>s1-intro</title></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: #f7f4ee; font-family: "Montserrat", sans-serif; color: #0d0b12; }
        #root .full { position: absolute; inset: 0; }
        #root canvas.dots { position: absolute; inset: 0; width: 100%; height: 100%; }
        #root .mono { font-family: "Space Mono", monospace; }
        #root svg.bean { position: absolute; overflow: visible; }
#root .intro { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-weight: 700; font-size: 84px; letter-spacing: -0.02em; }
        #root .intro span { opacity: 0; }
        #root .cursor { display: inline-block; width: 6px; height: 72px; background: #0d0b12; vertical-align: -8px; margin-left: 6px; }
        #root .corner { position: absolute; left: 70px; bottom: 56px; font-size: 24px; letter-spacing: 0.2em; color: #6d6679; }
      </style>
      <div id="root" data-composition-id="s1-intro" data-width="1920" data-height="1080" data-duration="5">
        <div class="intro" id="s1-intro-intro"><span>I</span><span>n</span><span>t</span><span>r</span><span>o</span><span>d</span><span>u</span><span>c</span><span>i</span><span>n</span><span>g</span><span>.</span><span>.</span><i class="cursor" id="s1-intro-cursor"></i></div>
        <canvas class="dots" id="s1-intro-dots" width="1920" height="1080"></canvas>
        <div class="full" id="s1-intro-beans"></div>
        <div class="corner mono" id="s1-intro-corner">DAYBREAK ISLAND · 2026</div>
      </div>
      <script>
// Shared helpers inlined into every scene (deterministic, no clocks, no Math.random).
//  HF.lcg(seed)                 seeded PRNG
//  HF.bean(o)                   an agent as a flat circle with a face (and its hat): SVG string
//  HF.eyes(type, ink)           just the eyes group (for swapping expressions)
//  HF.dotText(canvas, text, o)  text sampled into dots (outline or fill); paint(mode, p)
var HF = (function () {
  function lcg(seed) {
    var s = seed >>> 0;
    return function () { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
  }
  var INK = '#0d0b12';
  function lum(hex) {
    var n = parseInt(hex.slice(1), 16);
    return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255;
  }
  // eyes live in a 100-unit circle centred on 0,0; one eye at (+-17, -6)
  function eye(type, x, ink) {
    var y = -6, s = 'stroke="' + ink + '" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"';
    switch (type) {
      case 'o': return '<circle cx="' + x + '" cy="' + y + '" r="6.5" ' + s + '/>';
      case 'dot': return '<circle cx="' + x + '" cy="' + y + '" r="6" fill="' + ink + '"/>';
      case '^': return '<polyline points="' + (x - 7) + ',' + (y + 4) + ' ' + x + ',' + (y - 4) + ' ' + (x + 7) + ',' + (y + 4) + '" ' + s + '/>';
      case 'u': return '<path d="M' + (x - 7) + ',' + (y - 2) + ' Q' + x + ',' + (y + 8) + ' ' + (x + 7) + ',' + (y - 2) + '" ' + s + '/>';
      case '-': return '<line x1="' + (x - 7) + '" y1="' + y + '" x2="' + (x + 7) + '" y2="' + y + '" ' + s + '/>';
      case '+': return '<g ' + s + '><line x1="' + (x - 7) + '" y1="' + y + '" x2="' + (x + 7) + '" y2="' + y + '"/><line x1="' + x + '" y1="' + (y - 7) + '" x2="' + x + '" y2="' + (y + 7) + '"/></g>';
      case 'x': return '<g ' + s + '><line x1="' + (x - 6) + '" y1="' + (y - 6) + '" x2="' + (x + 6) + '" y2="' + (y + 6) + '"/><line x1="' + (x + 6) + '" y1="' + (y - 6) + '" x2="' + (x - 6) + '" y2="' + (y + 6) + '"/></g>';
      case '*': return '<g ' + s + ' stroke-width="4.5"><line x1="' + x + '" y1="' + (y - 8) + '" x2="' + x + '" y2="' + (y + 8) + '"/><line x1="' + (x - 7) + '" y1="' + (y - 4) + '" x2="' + (x + 7) + '" y2="' + (y + 4) + '"/><line x1="' + (x + 7) + '" y1="' + (y - 4) + '" x2="' + (x - 7) + '" y2="' + (y + 4) + '"/></g>';
      case '>': return '<polyline points="' + (x - 5) + ',' + (y - 7) + ' ' + (x + 5) + ',' + y + ' ' + (x - 5) + ',' + (y + 7) + '" ' + s + '/>';
      case '<': return '<polyline points="' + (x + 5) + ',' + (y - 7) + ' ' + (x - 5) + ',' + y + ' ' + (x + 5) + ',' + (y + 7) + '" ' + s + '/>';
      default: return '<text x="' + x + '" y="' + (y + 7) + '" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="21" fill="' + ink + '">' + type + '</text>';
    }
  }
  function eyes(type, ink) {
    var l = type === '><' ? '>' : type === '<>' ? '<' : type, r = type === '><' ? '<' : type === '<>' ? '>' : type;
    return eye(l, -17, ink) + eye(r, 17, ink);
  }
  function hat(kind, c) {
    switch (kind) {
      case 'straw': return '<ellipse cx="0" cy="-40" rx="56" ry="10" fill="' + c + '"/><path d="M-26,-40 Q-24,-66 0,-66 Q24,-66 26,-40 Z" fill="' + c + '"/><rect x="-26" y="-47" width="52" height="7" fill="#ff7aa2"/>';
      case 'beanie': return '<path d="M-40,-30 Q-40,-72 0,-72 Q40,-72 40,-30 Z" fill="' + c + '"/><rect x="-43" y="-36" width="86" height="12" rx="6" fill="' + c + '"/><circle cx="0" cy="-76" r="9" fill="' + c + '"/>';
      case 'bucket': return '<path d="M-48,-34 L-30,-64 L30,-64 L48,-34 Z" fill="' + c + '"/><rect x="-30" y="-50" width="60" height="6" fill="' + INK + '" opacity="0.8"/>';
      case 'cap': return '<path d="M-40,-32 Q-40,-72 0,-72 Q40,-72 40,-32 Z" fill="' + c + '"/><path d="M-6,-36 L58,-36 Q58,-28 44,-26 L-6,-26 Z" fill="' + c + '"/><circle cx="0" cy="-72" r="5" fill="#fff"/>';
      case 'explorer': return '<ellipse cx="0" cy="-38" rx="54" ry="9" fill="' + c + '"/><path d="M-32,-38 Q-30,-72 0,-72 Q30,-72 32,-38 Z" fill="' + c + '"/><rect x="-31" y="-46" width="62" height="7" fill="#8b5cf6"/>';
      default: return '';
    }
  }
  // o: { color, eyes, hat, hatColor, blush, ink, extra, cls, id }
  function bean(o) {
    var ink = o.ink || (lum(o.color) < 0.3 ? '#f7f4ee' : INK);
    return '<svg class="' + (o.cls || 'bean') + '"' + (o.id ? ' id="' + o.id + '"' : '') + ' viewBox="-60 -84 120 144" overflow="visible">' +
      '<circle cx="0" cy="0" r="48" fill="' + o.color + '"/>' +
      (o.blush ? '<ellipse cx="-27" cy="12" rx="8" ry="4.5" fill="#ff8a9a" opacity="0.85"/><ellipse cx="27" cy="12" rx="8" ry="4.5" fill="#ff8a9a" opacity="0.85"/>' : '') +
      '<g class="eyes">' + eyes(o.eyes || 'o', ink) + '</g>' +
      (o.eyes2 ? '<g class="eyes2" opacity="0">' + eyes(o.eyes2, ink) + '</g>' : '') +
      (o.hat ? hat(o.hat, o.hatColor) : '') + (o.extra || '') + '</svg>';
  }

  // Text -> dots. Samples the glyph OUTLINE (or the fill) of the text rastered at
  // `font`, centred at (x, y), on a grid. The table is built once; paint() is a pure
  // function of (mode, p): 'in' flies dots from a scattered cloud onto the glyphs,
  // 'hold' draws them in place, 'out' blows them away. The front sweeps left->right.
  function dotText(canvas, text, o) {
    var w = canvas.width, h = canvas.height, ctx = canvas.getContext('2d');
    var off = document.createElement('canvas'); off.width = w; off.height = h;
    var oc = off.getContext('2d', { willReadFrequently: true });
    oc.font = o.font; oc.textAlign = o.align || 'center'; oc.textBaseline = 'middle'; oc.fillStyle = '#fff';
    oc.fillText(text, o.x, o.y);
    var d = oc.getImageData(0, 0, w, h).data, step = o.step || 4, band = o.band || 3, pts = [], rnd = lcg(o.seed || 7);
    var lit = function (x, y) { return x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 127; };
    var minX = 1e9, maxX = -1e9;
    for (var y = 0; y < h; y += step) for (var x = 0; x < w; x += step) {
      if (!lit(x, y)) continue;
      if (o.outline && lit(x - band, y) && lit(x + band, y) && lit(x, y - band) && lit(x, y + band)) continue;
      var a = rnd() * Math.PI * 2;
      pts.push({ x: x, y: y, ox: Math.cos(a), oy: Math.sin(a), dist: (0.06 + 0.16 * rnd()) * w, r: (o.r || 1.6) * (0.75 + 0.5 * rnd()), j: rnd() });
      if (x < minX) minX = x; if (x > maxX) maxX = x;
    }
    var span = Math.max(1, maxX - minX);
    for (var i = 0; i < pts.length; i++) pts[i].k = (pts[i].x - minX) / span;
    var color = o.color || '#ff7a2e';
    return {
      count: pts.length,
      paint: function (mode, p, alpha) {
        ctx.fillStyle = color;
        for (var i = 0; i < pts.length; i++) {
          var q = pts[i], u, dx = 0, dy = 0, a = alpha === undefined ? 1 : alpha;
          if (mode === 'in') {
            u = Math.min(1, Math.max(0, (p - q.k * 0.45 - q.j * 0.1) / 0.45));
            if (u <= 0) continue;
            var e = 1 - Math.pow(1 - u, 3);
            dx = q.ox * q.dist * (1 - e); dy = q.oy * q.dist * (1 - e); a *= Math.min(1, u * 3);
          } else if (mode === 'out') {
            u = Math.min(1, Math.max(0, (p - q.k * 0.45 - q.j * 0.1) / 0.45));
            dx = q.ox * q.dist * u * u * 1.4 + u * u * 120; dy = q.oy * q.dist * u * u; a *= 1 - u;
            if (a <= 0.01) continue;
          }
          ctx.globalAlpha = a;
          ctx.beginPath(); ctx.arc(q.x + dx, q.y + dy, q.r, 0, 6.2832); ctx.fill();
        }
        ctx.globalAlpha = 1;
      },
    };
  }
  return { lcg: lcg, bean: bean, eyes: eyes, dotText: dotText, INK: INK };
})();

      (function () {
        var $ = function (s) { return document.getElementById('s1-intro-' + s); };
        var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll('[data-composition-id="s1-intro"] ' + s)); };
        var tl = gsap.timeline({ paused: true });
        function build() {

          var holder = $('beans');
          holder.insertAdjacentHTML('beforeend', HF.bean({"color":"#efe8da","hat":"straw","hatColor":"#e8c46a","eyes":"o","blush":true,"eyes2":"^"}).replace('<svg ', '<svg id="s1-intro-b0" style="width:300px;height:360px;left:370px;top:490px;" '));
          holder.insertAdjacentHTML('beforeend', HF.bean({"color":"#34313f","hat":"beanie","hatColor":"#ff7a2e","eyes":"o","blush":true,"eyes2":"-"}).replace('<svg ', '<svg id="s1-intro-b1" style="width:380px;height:456px;left:740px;top:354px;" '));
          holder.insertAdjacentHTML('beforeend', HF.bean({"color":"#28c06a","hat":"bucket","hatColor":"#ffd23f","eyes":"o","blush":true,"eyes2":"*"}).replace('<svg ', '<svg id="s1-intro-b2" style="width:280px;height:336px;left:1190px;top:504px;" '));
          holder.insertAdjacentHTML('beforeend', HF.bean({"color":"#8b5cf6","hat":"explorer","hatColor":"#f1ece2","eyes":"o","blush":true,"eyes2":"o"}).replace('<svg ', '<svg id="s1-intro-b3" style="width:200px;height:240px;left:230px;top:220px;" '));
          holder.insertAdjacentHTML('beforeend', HF.bean({"color":"#2a86ff","hat":"cap","hatColor":"#e5383b","eyes":"o","blush":true,"eyes2":"u"}).replace('<svg ', '<svg id="s1-intro-b4" style="width:230px;height:276px;left:1445px;top:219px;" '));
          holder.insertAdjacentHTML('beforeend', HF.bean({"color":"#ff7a2e","hat":"beanie","hatColor":"#26242e","eyes":"o","blush":true,"eyes2":"><"}).replace('<svg ', '<svg id="s1-intro-b5" style="width:170px;height:204px;left:1095px;top:211px;" '));
          var letters = $$('.intro span');
          letters.forEach(function (el, i) { tl.set(el, { opacity: 1 }, 0.1 + i * 0.05); });
          tl.fromTo($('cursor'), { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 5, yoyo: true, repeatDelay: 0.14 }, 0.2);
          var canvas = $('dots'), ctx = canvas.getContext('2d');
          var dt = HF.dotText(canvas, 'Introducing..', { font: '700 84px Montserrat', x: 960, y: 192, color: '#ff7a2e', step: 3, r: 2.1, seed: 11 });
          tl.set($('intro'), { opacity: 0 }, 1.05);
          tl.to({ p: 0 }, { p: 1, duration: 5, ease: 'none', onUpdate: function () {
            var t = this.targets()[0].p * 5; ctx.clearRect(0, 0, 1920, 1080);
            if (t >= 1.05 && t < 2.2) dt.paint('out', (t - 1.05) / 1.1);
          } }, 0);
          tl.fromTo($('b0'), { y: -900 - 0, rotation: -25 }, { y: 0, rotation: -1 * 6, duration: 0.95, ease: 'bounce.out' }, 1.15);
          tl.fromTo($('b1'), { y: -900 - 60, rotation: 25 }, { y: 0, rotation: 0 * 6, duration: 0.95, ease: 'bounce.out' }, 1.28);
          tl.fromTo($('b2'), { y: -900 - 120, rotation: -25 }, { y: 0, rotation: 1 * 6, duration: 0.95, ease: 'bounce.out' }, 1.41);
          tl.fromTo($('b3'), { y: -900 - 180, rotation: 25 }, { y: 0, rotation: -1 * 6, duration: 0.95, ease: 'bounce.out' }, 1.54);
          tl.fromTo($('b4'), { y: -900 - 240, rotation: -25 }, { y: 0, rotation: 0 * 6, duration: 0.95, ease: 'bounce.out' }, 1.67);
          tl.fromTo($('b5'), { y: -900 - 300, rotation: 25 }, { y: 0, rotation: 1 * 6, duration: 0.95, ease: 'bounce.out' }, 1.80);
          // blink, then everyone changes expression and looks toward Grit
          $$('.eyes').forEach(function (e, i) { tl.fromTo(e, { scaleY: 1, transformOrigin: '50% 45%' }, { scaleY: 0.1, duration: 0.07, yoyo: true, repeat: 1 }, 2.75 + (i % 3) * 0.05); });
          $$('.eyes').forEach(function (e, i) { tl.to(e, { opacity: 0, duration: 0.06 }, 3.2 + i * 0.04); });
          $$('.eyes2').forEach(function (e, i) { tl.to(e, { opacity: 1, duration: 0.06 }, 3.2 + i * 0.04); });
          // Grit swells to fill the frame; the rest get shoved out of the way
          tl.to($('b1'), { scale: 13, duration: 1.0, ease: 'power3.in', transformOrigin: '50% 58%' }, 3.9);
          tl.to($('b0'), { x: -656, y: 128, scale: 0.5, duration: 0.7, ease: 'power2.in' }, 3.95);
          
          tl.to($('b2'), { x: 640, y: 128, scale: 0.5, duration: 0.7, ease: 'power2.in' }, 3.95);
          tl.to($('b3'), { x: -960, y: -416, scale: 0.5, duration: 0.7, ease: 'power2.in' }, 3.95);
          tl.to($('b4'), { x: 1008, y: -384, scale: 0.5, duration: 0.7, ease: 'power2.in' }, 3.95);
          tl.to($('b5'), { x: 400, y: -464, scale: 0.5, duration: 0.7, ease: 'power2.in' }, 3.95);
          tl.to($('corner'), { opacity: 0, duration: 0.3 }, 4.1);
          window.__timelines["s1-intro"] = tl;
          if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
        }
        Promise.all([document.fonts.load('900 120px Montserrat'), document.fonts.load('700 60px Montserrat'), document.fonts.load('400 30px "Space Mono"')]).then(build, build);
      })();
      </script>
    </template>
  </body>
